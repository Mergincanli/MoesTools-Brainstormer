name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Formatting, the validator, generated docs in sync, and the tests. The copy-check needs the network,
      # so it is not run here.
      - run: npm run check
